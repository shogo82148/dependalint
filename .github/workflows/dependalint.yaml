name: dependalint

on:
  push:
    paths:
      - ".github/dependabot.yaml"
      - ".github/workflows/dependalint.yaml"
  pull_request:
    paths:
      - ".github/dependabot.yaml"
      - ".github/workflows/dependalint.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: run dependalint
        run: go run ./cmd/dependalint
