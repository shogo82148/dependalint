name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-installer:
    # Runs after the release assets (and checksums.txt) are published, so that
    # `binst embed-checksums --mode download` can fetch them. Kept in this
    # workflow (instead of a `release: published` trigger) because releases
    # created with GITHUB_TOKEN do not trigger new workflow runs.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install binst
        # Pin to an immutable version. Update this only through a separate
        # reviewed change (do not use @latest: a new release would run with a
        # token that has contents: write and pull-requests: write).
        run: go install github.com/binary-install/binstaller/cmd/binst@v0.12.0
      - name: Embed checksums for ${{ github.ref_name }}
        run: binst embed-checksums --config .config/binstaller.yml --version "${VERSION}" --mode download
      - name: Regenerate install.sh
        run: binst gen --config .config/binstaller.yml -o install.sh
      - name: Create pull request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          base: main
          add-paths: |
            .config/binstaller.yml
            install.sh
          commit-message: "Embed checksums and regenerate install.sh for ${{ github.ref_name }}"
          title: "Update install.sh for ${{ github.ref_name }}"
          body: |
            Embedded the checksums for `${{ github.ref_name }}` into `.config/binstaller.yml`
            and regenerated `install.sh`.

            Generated by the `update-installer` job of the release workflow.
          branch: auto/update-installer-${{ github.ref_name }}
          delete-branch: true
